name: Pull Request Quality & Security

on:
  pull_request:
    branches: [ main, dev ]
  push:
    branches: [ main, dev ]

jobs:
  secret-scan:
    name: TruffleHog Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog OSS
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: "${{ github.event.pull_request.base.sha || 'HEAD^' }}"
          head: "${{ github.event.pull_request.head.sha || 'HEAD' }}"
          extra_args: --debug --only-verified=false

  # Issue #514: Fuzz testing for Soroban smart contracts
  fuzz-tests:
    name: Soroban Fuzz Tests (proptest)
    runs-on: ubuntu-latest
    # Issue #668: scope contract checks to pull requests touching contracts/
    paths:
      - 'contracts/**'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run fuzz tests (proptest)
        run: cargo test --lib property_tests::fuzz_ -- --test-threads=1
        working-directory: contracts
        env:
          PROPTEST_CASES: 50

      - name: Run all contract tests
        run: cargo test --workspace --verbose
        working-directory: contracts

  # Issue #668: Build contracts to WebAssembly on pull requests touching
  # contracts/. This verifies the release Wasm artifacts compile with the
  # exact target used to build `contracts/nft` and the marketplace contract.
  contract-wasm-build:
    name: Contracts WebAssembly Build
    runs-on: ubuntu-latest
    paths:
      - 'contracts/**'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - name: Cache cargo registry & build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            contracts/target
          key: ${{ runner.os }}-cargo-wasm-${{ hashFiles('contracts/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-wasm-

      - name: Build contracts (release wasm)
        run: cargo build --workspace --release --target wasm32-unknown-unknown --verbose
        working-directory: contracts
